<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tantrums Queue</title>
<style>
  :root { --red:#E63A2E; --orange:#FF8A1F; --cream:#FFF4E2; --ink:#151515; --line:#E9D9BF; --muted:#8a7d6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font:16px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; padding-bottom:84px; }
  .display { font-family:"Arial Rounded MT Bold", ui-rounded, "Nunito", system-ui, sans-serif; font-weight:900; letter-spacing:.02em; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--red); color:var(--cream); }
  header img { width:44px; height:44px; border-radius:50%; border:2px solid var(--cream); }
  header h1 { margin:0; font-size:20px; line-height:1; }
  header small { display:block; font-size:11px; letter-spacing:.12em; opacity:.85; }
  header .sp { flex:1; }
  main { max-width:720px; margin:0 auto; padding:16px; }
  h2 { font-size:22px; margin:4px 0 12px; }
  button, select, input { font:inherit; }
  .btn { border:2px solid var(--ink); background:#fff; color:var(--ink); border-radius:14px; padding:12px 16px; font-weight:800; min-height:48px; cursor:pointer; }
  .btn.red { background:var(--red); color:#fff; }
  .btn.orange { background:var(--orange); }
  .btn.ghost { border-color:transparent; background:transparent; }
  .btn:disabled { opacity:.4; }
  header .btn { min-height:40px; padding:6px 12px; background:var(--cream); }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); }
  .card { background:#fff; border:2px solid var(--ink); border-radius:20px; padding:14px; box-shadow:4px 4px 0 var(--ink); }
  .court-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .court-head .display { font-size:20px; }
  .timer { font:800 22px ui-monospace, Consolas, monospace; padding:2px 10px; border-radius:10px; background:var(--cream); }
  .timer.over { background:var(--red); color:#fff; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { opacity:.55; } }
  .team { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:12px; background:var(--cream); }
  .team .names { flex:1; font-weight:700; }
  .team input { width:58px; text-align:center; border:2px solid var(--line); border-radius:10px; padding:8px 4px; }
  .team.won { background:#FFE3C2; outline:2px solid var(--orange); }
  .pill { border:2px solid var(--ink); background:#fff; border-radius:999px; padding:6px 10px; font-weight:800; font-size:12px; min-height:36px; cursor:pointer; }
  .team.won .pill { background:var(--ink); color:var(--cream); }
  .vs { text-align:center; font-size:12px; color:var(--muted); margin:4px 0; font-weight:800; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .chip { display:inline-block; font-size:11px; font-weight:800; padding:1px 6px; border-radius:6px; margin-left:4px; vertical-align:middle; }
  .l1 { background:#FFE3C2; } .l2 { background:var(--orange); } .l3 { background:var(--red); color:#fff; }
  .badge { font-size:12px; font-weight:800; background:var(--orange); border-radius:8px; padding:2px 8px; }
  .empty { text-align:center; padding:18px 0 4px; color:var(--muted); }
  form.add { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  form.add input { flex:1 1 160px; min-height:48px; border:2px solid var(--ink); border-radius:14px; padding:0 14px; }
  .seg { display:flex; border:2px solid var(--ink); border-radius:14px; overflow:hidden; }
  .seg label { display:flex; }
  .seg input { display:none; }
  .seg span { padding:12px 14px; font-weight:800; cursor:pointer; min-height:44px; }
  .seg input:checked + span { background:var(--ink); color:var(--cream); }
  ol.q { list-style:none; margin:0; padding:0; }
  ol.q li { display:flex; align-items:center; gap:8px; padding:10px 12px; background:#fff; border:2px solid var(--line); border-radius:14px; margin-bottom:8px; }
  ol.q li.paused { opacity:.5; }
  ol.q .n { width:28px; font-weight:900; color:var(--red); }
  ol.q .name { flex:1; font-weight:700; }
  ol.q .meta { font-size:12px; color:var(--muted); }
  ol.q .btn { min-height:40px; padding:6px 10px; }
  table { width:100%; border-collapse:collapse; background:#fff; border:2px solid var(--ink); border-radius:16px; overflow:hidden; }
  th, td { padding:10px; text-align:left; border-bottom:1px solid var(--line); }
  th { background:var(--ink); color:var(--cream); font-size:12px; letter-spacing:.08em; }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .set { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); }
  .set p { margin:2px 0 0; font-size:13px; color:var(--muted); }
  .stepper { display:flex; align-items:center; gap:10px; font-weight:900; font-size:20px; }
  .stepper .btn { width:48px; padding:0; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
  nav { position:fixed; left:0; right:0; bottom:0; display:grid; grid-template-columns:repeat(5,1fr); background:var(--ink); padding-bottom:env(safe-area-inset-bottom); }
  nav button { background:none; border:0; color:var(--cream); padding:12px 0 14px; font-weight:800; font-size:13px; opacity:.6; cursor:pointer; }
  nav button b { display:block; font-size:20px; }
  nav button.on { opacity:1; color:var(--orange); }
  .muted { color:var(--muted); }
  .hint { margin:-6px 0 12px; font-size:13px; }
  .shot { width:100%; height:auto; border-radius:12px; border:2px solid var(--ink); -webkit-touch-callout:default; -webkit-user-select:auto; user-select:auto; }
  .shot-tip { background:#fff; border:2px dashed var(--orange); border-radius:12px; padding:10px 12px; }
  .pname { all:unset; cursor:pointer; border-bottom:2px dotted var(--muted); }
  .pname:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .sheet-bg { position:fixed; inset:0; z-index:20; background:rgba(21,21,21,.55); display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:var(--cream); width:100%; max-width:560px; max-height:78vh; overflow:auto; border-radius:22px 22px 0 0; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); display:grid; gap:12px; }
  .sheet h2 { margin:0; }
  .sheet p { margin:0; }
  .opts { display:grid; gap:8px; }
  .opt { display:flex; justify-content:space-between; align-items:center; gap:10px; background:#fff; border:2px solid var(--ink); border-radius:14px; padding:12px 14px; font:inherit; font-weight:800; min-height:52px; cursor:pointer; text-align:left; }
  .upnext { margin-top:16px; background:var(--red); color:var(--cream); border:2px solid var(--ink); border-radius:20px; padding:14px; box-shadow:4px 4px 0 var(--ink); display:grid; gap:10px; }
  .uhead { display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .uhead .display { font-size:20px; }
  .uto { font-size:12px; font-weight:800; letter-spacing:.06em; opacity:.85; }
  .ugroup { display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; background:var(--cream); color:var(--ink); border-radius:14px; padding:10px 12px; font-weight:800; font-size:17px; }
  .uvs { font-size:11px; color:var(--muted); letter-spacing:.1em; }
  .uopen { font-weight:700; font-size:14px; color:var(--muted); }
  .unote { margin:0; background:var(--cream); color:var(--ink); border-radius:14px; padding:10px 12px; font-weight:600; }
  .uthen { display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-size:14px; }
  .uthen b { margin-right:2px; }
  .uq { display:inline-flex; align-items:center; gap:5px; background:var(--cream); color:var(--ink); border-radius:999px; padding:3px 10px 3px 4px; font-weight:700; }
  .uq i { font-style:normal; font-weight:900; font-size:11px; background:var(--ink); color:var(--cream); border-radius:50%; width:20px; height:20px; display:inline-grid; place-items:center; }
  body.tv .upnext { margin-top:0; border:0; box-shadow:none; border-radius:24px; padding:clamp(14px,1.6vw,32px); gap:1vw; }
  body.tv .uhead .display { font-size:clamp(20px,2.2vw,42px); }
  body.tv .uto { font-size:clamp(12px,1.2vw,22px); }
  body.tv .ugroup, body.tv .unote { font-size:clamp(20px,2.6vw,48px); padding:clamp(10px,1.2vw,24px); }
  body.tv .uvs, body.tv .uopen { font-size:.5em; }
  body.tv .uthen { font-size:clamp(14px,1.6vw,30px); gap:.6vw; }
  body.tv .uq i { width:1.5em; height:1.5em; font-size:.7em; }
  .ugroup .chip, .uq .chip { font-size:.6em; }
  .chipbtn { border:0; cursor:pointer; font-family:inherit; min-width:28px; min-height:24px; }
  body.tv { background:var(--ink); padding-bottom:0; }
  body.tv header, body.tv nav { display:none; }
  body.tv main { max-width:none; padding:2vw; }
  .tvhead { display:flex; align-items:center; gap:1.5vw; color:var(--cream); margin-bottom:2vw; }
  .tvhead img { width:6vw; min-width:56px; border-radius:50%; border:3px solid var(--cream); }
  .tvtitle { font-size:clamp(28px,4vw,72px); line-height:1; }
  .tvsub { font-weight:800; letter-spacing:.15em; font-size:clamp(12px,1.3vw,22px); opacity:.8; }
  .tvexit { margin-left:auto; opacity:.45; }
  .tvbody { display:grid; gap:2vw; }
  .tvcourts { display:grid; gap:1.5vw; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); }
  .tvcourt { background:var(--cream); border-radius:24px; padding:clamp(14px,1.6vw,32px); border:5px solid var(--cream); }
  .tvcourt.fresh { border-color:var(--orange); box-shadow:0 0 0 6px var(--orange); }
  .tvch { display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:clamp(20px,2.2vw,42px); color:var(--red); margin-bottom:1vw; }
  .tvch .timer { font-size:inherit; }
  .tvteam { font-weight:800; font-size:clamp(20px,2.5vw,46px); line-height:1.15; }
  .tvvs { color:var(--muted); font-weight:900; margin:.5vw 0; font-size:clamp(12px,1.1vw,20px); letter-spacing:.1em; }
  .tvempty { color:var(--muted); font-weight:800; font-size:clamp(18px,2vw,36px); padding:1.5vw 0; }
  .tvteam .chip { font-size:.45em; }
</style>

<script type="module">
const Q = (() => {
// Open-play queue logic. Pure (no DOM): actions mutate the state they're given; UI saves it after.
const court = (id) => ({ id, team1: [], team2: [], streak: 0, endsAt: null, waiting: false });

const newState = () => ({
  players: [], queue: [], courts: [court(1), court(2)],
  mode: "stack", balance: true, gameMins: 15, nextId: 1, history: [],
  met: {}, mates: {}, // how often each pair has shared a court / been partners, so line-ups keep mixing
});

// Snapshot before each action so a mis-tap can be undone.
function snap(s) {
  const { history, ...rest } = s;
  s.history = [...history.slice(-11), JSON.stringify(rest)];
}
function undo(s) {
  const h = s.history.pop();
  return h ? { ...JSON.parse(h), history: s.history } : s;
}

const player = (s, id) => s.players.find((p) => p.id === id);
const onCourt = (s, id) => s.courts.some((c) => c.team1.includes(id) || c.team2.includes(id));
const eligible = (s) => s.queue.filter((id) => !player(s, id).paused);
const prio = (s, id) => player(s, id).prio ?? 0; // games counted for rotation (newcomers start level with the rest)
const minPrio = (s, not) => Math.min(...s.players.filter((p) => p.id !== not && !p.paused && !p.out).map((p) => p.prio ?? 0), Infinity);
const key = (a, b) => (a < b ? `${a}-${b}` : `${b}-${a}`);
const cnt = (m, a, b) => m?.[key(a, b)] ?? 0;
const bump = (m, a, b) => { m[key(a, b)] = cnt(m, a, b) + 1; };
function combos(arr, k, from = 0, cur = [], out = []) {
  if (cur.length === k) out.push(cur);
  else for (let i = from; i < arr.length; i++) combos(arr, k, i + 1, [...cur, arr[i]], out);
  return out;
}

const startPrio = (s, id) => { const m = minPrio(s, id); return m === Infinity ? 0 : m; };

// The roster keeps every player between sessions; `out` = in the roster but not here today.
// Adding a name that is already in the roster checks that player in instead of making a duplicate.
function addPlayer(s, name, level = 2) {
  const known = s.players.find((p) => p.name.toLowerCase() === name.trim().toLowerCase());
  if (known) return known.out ? checkIn(s, known.id) : undefined;
  snap(s);
  const id = s.nextId++;
  s.players.push({ id, name: name.trim(), level, paused: false, out: false, prio: startPrio(s) });
  s.queue.push(id);
}
function checkIn(s, id) {
  const p = player(s, id);
  if (!p?.out) return;
  snap(s);
  Object.assign(p, { out: false, paused: false, prio: startPrio(s, id) });
  s.queue.push(id);
}
// Leaves today's session, stays in the roster.
function checkOut(s, id) {
  if (onCourt(s, id)) return;
  snap(s);
  player(s, id).out = true;
  s.queue = s.queue.filter((q) => q !== id);
}
function setLevel(s, id, level) {
  snap(s);
  player(s, id).level = level;
}
// Deletes the player from the roster for good.
function removePlayer(s, id) {
  if (onCourt(s, id)) return;
  snap(s);
  s.players = s.players.filter((p) => p.id !== id);
  s.queue = s.queue.filter((q) => q !== id);
}
function togglePause(s, id) {
  snap(s);
  const p = player(s, id);
  p.paused = !p.paused;
  if (!p.paused) p.prio = Math.max(p.prio ?? 0, startPrio(s, id)); // no catch-up streak after a break
}

// Fewest games first, then longest waiting; the front of the line always plays. Among players tied on
// games, choose the group that has shared a court least (and, with balance on, closest in level).
// `fixed` = players already on court (winners staying on).
function pick(s, n, fixed = []) {
  const el = eligible(s).filter((id) => !fixed.includes(id));
  if (el.length < n) return null;
  const pos = new Map(s.queue.map((id, i) => [id, i]));
  const sorted = [...el].sort((a, b) => prio(s, a) - prio(s, b) || pos.get(a) - pos.get(b));
  // Extra games are a strong cost, not a hard rule: someone one game ahead can step in when that
  // breaks up a group that keeps playing together.
  const [head, ...pool] = sorted.slice(0, 9);
  const hl = player(s, head).level, base = prio(s, head);
  let best, bestScore = Infinity;
  for (const c of combos(pool, n - 1)) {
    const group = [head, ...c];
    const all = [...fixed, ...group];
    let sc = c.reduce((t, id) => t + pos.get(id) + 150 * (prio(s, id) - base), 0);
    for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++) sc += 100 * cnt(s.met, all[i], all[j]);
    if (s.balance) sc += 10 * group.reduce((t, id) => t + Math.abs(player(s, id).level - hl), 0);
    if (sc < bestScore) { bestScore = sc; best = group; }
  }
  return best;
}
const take = (s, ids) => { s.queue = s.queue.filter((id) => !ids.includes(id)); };

// Swap a player who can't play (on a court or locked in Up next) for someone waiting. The player
// swapped out sits out and keeps their place at the front of the line for when they're back.
function replacePlayer(s, outId, inId) {
  const c = s.courts.find((x) => x.team1.includes(outId) || x.team2.includes(outId));
  const inNext = (s.next ?? []).includes(outId);
  if ((!c && !inNext) || !eligible(s).includes(inId) || (inNext && s.next.includes(inId))) return;
  snap(s);
  const sw = (arr) => arr.map((x) => (x === outId ? inId : x));
  if (c) {
    c.team1 = sw(c.team1); c.team2 = sw(c.team2);
    take(s, [inId]);
    s.next = (s.next ?? []).filter((x) => x !== inId);
    s.queue.unshift(outId);
  } else {
    s.next = sw(s.next);
  }
  player(s, outId).paused = true;
}

// Of the 3 ways to pair 4 players: fewest repeat partners, then (balance on) the most even team levels.
function split(s, [a, b, c, d]) {
  const lv = (id) => player(s, id).level;
  const score = ([t1, t2]) => 100 * (cnt(s.mates, ...t1) + cnt(s.mates, ...t2)) + (s.balance ? 10 * Math.abs(lv(t1[0]) + lv(t1[1]) - lv(t2[0]) - lv(t2[1])) : 0);
  return [[[a, b], [c, d]], [[a, c], [b, d]], [[a, d], [b, c]]].reduce((x, y) => (score(y) < score(x) ? y : x));
}

// The locked "Up next" players first, topped up by the normal pick.
function group(s, n, fixed = []) {
  const el = eligible(s);
  const head = (s.next ?? []).filter((id) => el.includes(id)).slice(0, n);
  if (head.length === n) return head;
  const more = pick(s, n - head.length, [...fixed, ...head]);
  return more ? [...head, ...more] : null;
}

function fill(s, c, four = group(s, 4)) {
  if (!four) return;
  c.waiting = false;
  take(s, four);
  [c.team1, c.team2] = split(s, four);
  c.streak = 0;
  c.endsAt = Date.now() + s.gameMins * 60e3;
}
function fillCourt(s, courtId) {
  const c = s.courts.find((x) => x.id === courtId);
  if (c.team1.length || !group(s, 4)) return;
  snap(s);
  fill(s, c);
}

// A typed score decides the winner when it clearly does (organizers sometimes tap the wrong button).
const byScore = (winner, score) => (score && score[0] !== score[1] ? (score[0] > score[1] ? 1 : 2) : winner);

// winner: 1 or 2. score: optional [team1Points, team2Points].
function endGame(s, courtId, winner, score) {
  snap(s);
  const c = s.courts.find((x) => x.id === courtId);
  winner = byScore(winner, score);
  s.matches ||= [];

    const d = p.pf - p.pa;
    text(`${p.w}-${p.l}`, cols.wl, mid, F(900, 34), C.ink, "center");
    text(`${d > 0 ? "+" : ""}${d}`, cols.diff, mid, F(800, 32), d > 0 ? "#1F8A4C" : d < 0 ? C.red : C.muted, "center");
    text(String(p.games), cols.gp, mid, F(800, 32), C.ink, "center");
  });

  g.fillStyle = C.ink; g.fillRect(0, H - 90, W, 90);
  text("PICKLEBALL CLUB · OPEN PLAY", W / 2, H - 34, F(800, 28), C.cream, "center");
  return new Promise((res, rej) => cv.toBlob((b) => (b ? res(b) : rej()), "image/png"));
}

// Big "Now playing / Up next" board for a TV or laptop. Read-only; follows the organizer live.
const isTV = () => location.hash === "#tv";
function tvView() {
  const fresh = (c) => c.endsAt && Date.now() - (c.endsAt - s.gameMins * 60e3) < 30e3;
  return `
  <div class="tvhead"><img src="${document.querySelector("header img").src}" alt="">
    <div><div class="display tvtitle">THE TANTRUMS</div><div class="tvsub">OPEN PLAY · <span id="clock"></span></div></div>
    <button class="btn tvexit" data-act="tvexit">Exit TV</button></div>
  <div class="tvbody">
    <div class="tvcourts">${s.courts.map((c) => `
      <div class="tvcourt ${fresh(c) ? "fresh" : ""}">
        <div class="tvch"><span class="display">COURT ${c.id}</span>${c.team1.length ? `<span class="timer" data-ends="${c.endsAt}"></span>` : ""}</div>
        ${c.team1.length ? `<div class="tvteam">${c.team1.map(name).join(" &amp; ")}</div><div class="tvvs">VS</div><div class="tvteam">${c.team2.map(name).join(" &amp; ")}</div>`
          : `<div class="tvempty">${c.waiting ? "Mixing players…" : "Open court"}</div>`}
      </div>`).join("")}</div>
    ${upNextHTML()}
  </div>`;
}
setInterval(() => isTV() && render(), 15000); // clears the "just called" highlight
addEventListener("hashchange", () => render());

let shot = null; // { png: Blob, url: data URL } while the leaderboard image is open
const shotSheet = () => `<div class="sheet-bg" data-act="shotclose"><div class="sheet" data-act="noop" role="dialog" aria-label="Leaderboard image">
    <h2 class="display">Leaderboard image</h2>
    <p class="shot-tip"><b>iPhone:</b> press and hold the image, then tap <b>Save to Photos</b>.</p>
    <img class="shot" src="${shot.url}" alt="The Tantrums leaderboard">
    <div class="row2">
      <button class="btn orange" data-act="shotfile">Save as file</button>
      <button class="btn" data-act="shotclose">Close</button>
    </div>
  </div></div>`;

function render() {
  document.body.classList.toggle("tv", isTV());
  document.getElementById("app").innerHTML = isTV() ? tvView() : views[tab]() + (swapFor ? swapSheet() : "") + (shot ? shotSheet() : "");
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  document.getElementById("undo").disabled = !s.history.length;
  tick();
}

// Countdown + one beep/vibrate per court when time runs out.
let audio;
const beeped = new Set();
function beep() {
  if (isTV()) return;
  navigator.vibrate?.([300, 150, 300]);
  if (!audio) return;
  for (const t of [0, 0.35, 0.7]) {
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(0.3, audio.currentTime + t); g.gain.setValueAtTime(0, audio.currentTime + t + 0.2);
    o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.25);
  }
}
function tick() {
  const now = Date.now();
  const clock = document.getElementById("clock");
  if (clock) clock.textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  for (const c of s.courts) if (c.endsAt && now >= c.endsAt && !beeped.has(c.endsAt)) { beeped.add(c.endsAt); beep(); }
  document.querySelectorAll(".timer").forEach((el) => {
    const left = Math.round((+el.dataset.ends - now) / 1000);
    const a = Math.abs(left);
    el.textContent = `${left < 0 ? "+" : ""}${Math.floor(a / 60)}:${String(a % 60).padStart(2, "0")}`;
    el.classList.toggle("over", left <= 0);
  });
}
setInterval(tick, 1000);
// Don't beep for games that ran out before the app was (re)opened.
s.courts.forEach((c) => c.endsAt && c.endsAt <= Date.now() && beeped.add(c.endsAt));

document.addEventListener("click", (e) => {
  audio ||= new (window.AudioContext || window.webkitAudioContext)(); // unlocked by first tap
  const t = e.target.closest("[data-tab],[data-act]");
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; return render(); }
  const id = +t.dataset.id, court = +t.dataset.court, d = +t.dataset.d;
  switch (t.dataset.act) {
    case "undo": return act(() => { s = Q.undo(s); });
    case "fill": return act(() => Q.fillCourt(s, court));
    case "win": {
      const a = document.getElementById(`sc${court}a`).value, b = document.getElementById(`sc${court}b`).value;
      return act(() => Q.endGame(s, court, +t.dataset.team, a !== "" && b !== "" ? [+a, +b] : undefined));
    }
    case "setwin": return act(() => Q.editMatch(s, +t.dataset.match, { winner: +t.dataset.team, score: logScore(+t.dataset.match, false) }));
    case "pause": return act(() => Q.togglePause(s, id));
    case "remove": return confirmTap(t, () => Q.removePlayer(s, id));
    case "checkin": return act(() => Q.checkIn(s, id));
    case "swap": swapFor = id; return render();
    case "swapcancel": swapFor = null; return render();
    case "noop": return;
    case "swapto": { const out = swapFor; swapFor = null; return act(() => Q.replacePlayer(s, out, id)); }
    case "checkout": return act(() => Q.checkOut(s, id));
    case "level": return act(() => Q.setLevel(s, id, (Q.player(s, id).level % 3) + 1));
    case "tv": location.hash = "tv"; return render();
    case "tvexit": history.replaceState(null, "", location.pathname + location.search); return render();
    case "courts": return act(() => Q.setCourts(s, Math.min(12, Math.max(1, s.courts.length + d))));
    case "mins": return act(() => { s.gameMins = Math.min(60, Math.max(1, s.gameMins + d)); });
    case "session": return confirmTap(t, () => Q.newSession(s));
    case "wipe": return confirmTap(t, () => { const { history, ...rest } = s; s = { ...Q.newState(), history: [...history, JSON.stringify(rest)] }; });
    // Show the image on screen: on iPhone, press-and-hold → Save to Photos is the only way into the
    // gallery (downloads land in the Files app). "Save as file" stays for computers and Android.
    case "export": return statsImage().then((png) => new Promise((res) => {
      const r = new FileReader();
      r.onload = () => { shot = { png, url: r.result }; res(render()); };
      r.readAsDataURL(png);
    })).catch(() => {});
    case "shotclose": shot = null; return render();
    case "shotfile": {
      const filename = `tantrums-leaderboard-${new Date().toISOString().slice(0, 10)}.png`;
      if (window.claude?.use) return window.claude.use("downloads").then((d) => d?.save({ filename, data: shot.png })).catch(() => {});
      return Object.assign(document.createElement("a"), { href: shot.url, download: filename }).click();
    }
  }
});
// Both boxes filled = a score; both empty = no score; one filled = still typing.
function logScore(id, strict = true) {
  const a = document.getElementById(`m${id}s1`)?.value, b = document.getElementById(`m${id}s2`)?.value;
  if (a !== "" && b !== "") return [+a, +b];
  if (a === "" && b === "") return null;
  return strict ? undefined : (s.matches.find((m) => m.id === id)?.score ?? null); // half-typed: keep the saved score
}
document.addEventListener("change", (e) => {
  if (e.target.dataset.match) {
    const id = +e.target.dataset.match, score = logScore(id);
    if (score !== undefined) act(() => Q.editMatch(s, id, { score }));
    return;
  }
  if (e.target.name === "lv") level = +e.target.value;
  if (e.target.name === "mode") act(() => { s.mode = e.target.value; });
  if (e.target.id === "balance") act(() => { s.balance = e.target.checked; });
});
// Typing a name filters the roster.
document.addEventListener("input", (e) => {
  if (e.target.name !== "n") return;
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll(".roster li").forEach((li) => { li.hidden = !!q && !li.dataset.name.includes(q); });
});
document.addEventListener("submit", (e) => {
  e.preventDefault();
  const input = e.target.elements.n;
  if (!input.value.trim()) return;
  act(() => Q.addPlayer(s, input.value, level));
  document.querySelector("#add input[name=n]").focus();
});

render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>

</body></html>
